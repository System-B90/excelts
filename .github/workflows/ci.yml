name: CI

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]
    # Weekly, so an advisory published against a bundled package fails a
    # build even when nothing in this repo has changed (see audit job).
    schedule:
        - cron: "17 5 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# GitHub-hosted on purpose, unlike the rest of the org. This repo is public,
# and a self-hosted runner on a public repo runs any fork's PR code on the
# org's own box. Hosted minutes are free for public repos, so the usual
# reason to avoid them does not apply either.
jobs:
    test:
        name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                node: ["20", "22", "24", "26"]
                # The tmp shim and the file-based tests branch on platform.
                include:
                    - os: windows-latest
                      node: "24"
                    - os: macos-latest
                      node: "24"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # `npm test` builds first (pretest), so every leg tests a bundle
            # it produced itself -- against the recorded snapshots.
            - name: Build + test
              run: npm test

            - name: Typecheck consumers (nodenext ESM/CJS, bundler, node10)
              run: npm run test:types

    turbopack:
        name: Next.js / Turbopack consumer
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            # Packs the package, builds a standalone Next.js app on it, fails if
            # Turbopack traces any of its files, then serves a workbook.
            - name: Build and run a Next.js app against the packed package
              run: npm run test:turbopack

    audit:
        name: Advisories in bundled code
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            # Consumers' `npm audit` cannot see inside the bundle; this can.
            - name: Audit the packages compiled into dist/index.cjs
              run: npm run audit:bundle
